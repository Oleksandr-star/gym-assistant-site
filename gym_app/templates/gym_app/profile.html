{% extends "gym_app/base.html" %}
{% block content %}
<h2>Мій профіль</h2>
<div class="card">
    <div class="card-body">
        <p><strong>Ім'я користувача:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <a href="{% url 'edit_profile' %}" class="btn btn-primary">Редагувати профіль</a>
        <a href="{% url 'change_password' %}" class="btn btn-outline-secondary">Змінити пароль</a>
        <a href="{% url 'delete_account' %}" class="btn btn-outline-danger">Видалити акаунт</a>
    </div>
</div>
{% endblock %}
