{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Вхід – GymAssistant</title>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #E9ECFF;">
    <div class="card form-card" style="width: 100%; max-width: 450px;">
        <div class="card-header text-center">Вхід</div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Ім'я користувача</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Увійти</button>
            </form>
            <div class="mt-3 text-center">
                <small>Немає акаунту? <a href="{% url 'register' %}">Зареєструватися</a></small>
            </div>
        </div>
        <p class="mt-3">Тестові користувачі:<br>
        user / 123user (звичайний)<br>
        admin / 12345 (адміністратор)</p>
    </div>
</body>
</html>
